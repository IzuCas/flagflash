version: '3.8'

services:
  # ================================================
  # PostgreSQL - Primary Database
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: flagflash-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - flagflash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagflash} -d ${POSTGRES_DB:-flagflash}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # Redis - Cache and Pub/Sub
  # ================================================
  redis:
    image: redis:7-alpine
    container_name: flagflash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_secret}
    env_file:
      - .env
    volumes:
      - redis-data:/data
    networks:
      - flagflash-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # FlagFlash API - Go Backend
  # ================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: flagflash-api
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      # Mount Docker socket to allow container management (legacy Docker UI)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist configuration
      - api-config:/root/.docker-manager
    env_file:
      - .env
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - flagflash-network
    # healthcheck removed to avoid startup failures when utilities are missing

  # ================================================
  # FlagFlash App - React Frontend
  # ================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flagflash-app
    restart: unless-stopped
    ports:
      - "9002:80"
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - flagflash-network

networks:
  flagflash-network:
    driver: bridge
    name: flagflash-network

volumes:
  postgres-data:
    name: flagflash-postgres-data
  redis-data:
    name: flagflash-redis-data
  api-config:
    name: flagflash-api-config
